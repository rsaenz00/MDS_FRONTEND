<div mat-dialog-title>
    Ingresar códigos
</div>
<mat-dialog-content>
    <div class="row">
        <div class="col-md-4">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Código de autorización</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
        <div class="col-md-4">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Código de asegurado</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
        <div class="col-md-4">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>N° de ticket</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Tipo de afiliación</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
        <div class="col-md-6">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Producto</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Poliza</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
        <div class="col-md-4">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Certif.</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
    </div>
    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
        <mat-label>Fecha inicio de vigencia</mat-label>
        <input matInput>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions class="text-center">
    <button mat-flat-button color="accent">Aceptar</button>
</mat-dialog-actions>
