<div mat-dialog-title>
    Registrar clínica
</div>
<mat-dialog-content>
    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
        <mat-label>Código IPRESS</mat-label>
        <input matInput>
    </mat-form-field>
    <div class="row">
        <div class="col-md-9">
            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                <mat-label>Ubigeo</mat-label>
                <input matInput>
            </mat-form-field>
        </div>
        <div class="col-md-3">
            <button mat-flat-button color="accent">...</button>
        </div>
    </div>
    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
        <mat-label>Dirección</mat-label>
        <input matInput>
    </mat-form-field>
    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
        <mat-label>Teléfono</mat-label>
        <input matInput>
    </mat-form-field>
    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
        <mat-label>Nombre clínica</mat-label>
        <input matInput>
    </mat-form-field>
    <div class="row" style="margin-bottom: 10px;" matSort>
        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="position">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by number">
                    No.
                </th>
                <td mat-cell *matCellDef="let element"> {{element.position}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                    Name
                </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="weight">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by weight">
                    Weight
                </th>
                <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
            </ng-container>

            <ng-container matColumnDef="symbol">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by symbol">
                    Symbol
                </th>
                <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <mat-form-field style="width: 100%;" appearance="outline">
        <mat-label>Estado</mat-label>
        <mat-select>
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
        </mat-select>
    </mat-form-field>
    <mat-form-field style="width: 100%;" appearance="outline">
        <mat-label>Validación</mat-label>
        <mat-select>
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
        </mat-select>
    </mat-form-field>
    <div class="row">
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;">Nuevo</button>
        </div>
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;">Cancelar</button>
        </div>
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;">Guardar</button>
        </div>
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;">Salir</button>
        </div>
    </div>
</mat-dialog-content>
