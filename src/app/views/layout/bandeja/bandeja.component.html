<div class="main-body">

    <!--FILTERS-->
    <div class="row">
        <div class="col-md-12">
            <mat-form-field>
                <mat-label>Filtro 1</mat-label>
                <mat-select name="filtro1">
                    <mat-option value="1">Option 1</mat-option>
                    <mat-option value="2">Option 2</mat-option>
                    <mat-option value="3">Option 3</mat-option>
                </mat-select>
            </mat-form-field>
            &nbsp;
            <mat-form-field>
                <mat-label>Filtro 2</mat-label>
                <mat-select name="filtro2">
                    <mat-option value="1">Option 1</mat-option>
                    <mat-option value="2">Option 2</mat-option>
                    <mat-option value="3">Option 3</mat-option>
                </mat-select>
            </mat-form-field>
            &nbsp;
            <mat-form-field>
                <mat-label>Reporte</mat-label>
                <mat-select name="filtro2">
                    <mat-option value="1">Option 1</mat-option>
                    <mat-option value="2">Option 2</mat-option>
                    <mat-option value="3">Option 3</mat-option>
                </mat-select>
            </mat-form-field>
            &nbsp;
            <mat-form-field style="width: 100px;">
                <mat-label>Estado</mat-label>
                <mat-select name="estado">
                    <mat-option value="0">0</mat-option>
                    <mat-option value="1">1</mat-option>
                    <mat-option value="2">2</mat-option>
                    <mat-option value="3">3</mat-option>
                    <mat-option value="4">4</mat-option>
                    <mat-option value="5">5</mat-option>
                    <mat-option value="6">6</mat-option>
                    <mat-option value="7">7</mat-option>
                    <mat-option value="8">8</mat-option>
                </mat-select>
            </mat-form-field>
            &nbsp;
            <mat-form-field style="width: 150px;">
                <mat-label>Fecha inicio</mat-label>
                <input matInput [matDatepicker]="fecha_inicio">
                <mat-datepicker-toggle matIconSuffix [for]="fecha_inicio">
                    <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                </mat-datepicker-toggle>
                <mat-datepicker #fecha_inicio></mat-datepicker>
            </mat-form-field>
            &nbsp;
            <mat-form-field style="width: 150px;">
                <mat-label>Fecha fin</mat-label>
                <input matInput [matDatepicker]="fecha_fin">
                <mat-datepicker-toggle matIconSuffix [for]="fecha_fin">
                    <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                </mat-datepicker-toggle>
                <mat-datepicker #fecha_fin></mat-datepicker>
            </mat-form-field>
            &nbsp;
            <button mat-fab color="accent" aria-label="Example icon button with a bookmark icon">
                <mat-icon>search</mat-icon>
            </button>
        </div>
    </div>

    <!--BUTTONS-->
    <div class="row">
        <div class="col-md-8">
            <button mat-flat-button (click)="openAddEditBlogForm()" color="accent">
                Agregar Blog
            </button>
            &nbsp;
            <button mat-flat-button color="accent">
                Emitir constancia
            </button>
            &nbsp;
            <button mat-flat-button color="primary">
                Validar llegada
            </button>
            &nbsp;
            <button mat-flat-button color="warn">
                Nueva alerta
            </button>
            &nbsp;
            <button mat-flat-button color="warn">
                Alertas
            </button>
        </div>
        <div class="col-md-4 text-right">
            <div class="sem_estado_atencion" style="background: #96fac8;"
                matTooltip="Atención primera o próxima que realizará el médico"></div>
            <div class="sem_estado_atencion" style="background: #ff7878;"
                matTooltip="Hora actual sobrepasa en más de 5 min. a tiempo estimado"></div>
            <div class="sem_estado_atencion" style="background: #ffae66;"
                matTooltip="Médico se encuentra en casa de paciente más de 30 min"></div>
            <div class="sem_estado_atencion" style="background: #c2cde4;"
                matTooltip="Atención vencida de confirmación (Validación 48 hrs antes)"></div>
            <div class="sem_estado_atencion" style="background: #dbd0cc;"
                matTooltip="CRÓNICOS: Atención vencida al realizar (Validación 24 hrs despues)"></div>
            <div class="sem_estado_atencion" style="background: #f2e700;"
                matTooltip="CRÓNICOS: Atención validar medicación de atención"></div>
            <div class="sem_estado_atencion" style="background: #90ee90;" matTooltip="Atención sin asignar proveedor">
            </div>
            <div class="sem_estado_atencion" style="background: #ffffe0;" matTooltip="Atención asignado a un proveedor">
            </div>
            <div class="sem_estado_atencion" style="background: #ffffff;" matTooltip="Atención finalizada"></div>
            <div class="sem_estado_atencion" style="background: #ee82ee;"
                matTooltip="Atención fuera de tiempo estimado"></div>
        </div>
    </div>

    <!--DATA TABLE-->
    <div>
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by id">
                    ID
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox class="example-margin"> {{row.id}}</mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="url">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by url">
                    URL
                </th>
                <td mat-cell *matCellDef="let row"> {{row.url}} </td>
            </ng-container>

            <ng-container matColumnDef="accion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Accion </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" (click)="openEditForm(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteBlog(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
            aria-label="Select page of periodic elements">
        </mat-paginator>
    </div>

    <!--BUTTONS FOOTER-->
    <div class="row" style="margin-top: 10px;">
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Segumiento
            </button>
            <div style="padding: 3px 0;"></div>
            <button mat-flat-button color="accent" style="width: 100%;" (click)="openSoporteDialog()">
                Soporte
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Nueva atención
            </button>
            <div style="padding: 3px 0;"></div>
            <button mat-flat-button color="accent" style="width: 100%;">
                Exportar
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Ver datos atención
            </button>
            <div style="padding: 3px 0;"></div>
            <button mat-flat-button color="accent" style="width: 100%;">
                Observaciones
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Datos paciente
            </button>
            <div style="padding: 3px 0;"></div>
            <button mat-flat-button color="accent" style="width: 100%;">
                Códigos
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Editar
            </button>
            <div style="padding: 3px 0;"></div>
            <button mat-flat-button color="accent" style="width: 100%;">
                Atenciones pasadas
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%; padding-top: 10px !important; padding-bottom: 10px !important;">
                Nuevo servicio monitoreo Dr. Online
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
    </div>

</div>
