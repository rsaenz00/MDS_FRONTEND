<div mat-dialog-title>
    Seguimiento de servicios
</div>
<mat-dialog-content>
    <mat-card class="example-card">
        <mat-card-content>
            <div class="row">
                <div class="col-md-10">
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Código</mat-label>
                        <input matInput>
                    </mat-form-field>
                </div>
                <div class="col-md-2">
                    <button mat-stroked-button color="primary" style="width: 100%;">Buscar</button>
                </div>
                <div class="col-md-10">
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <textarea matInput placeholder="Descripción..." style="resize: none"></textarea>
                    </mat-form-field>
                </div>
                <div class="col-md-2">
                    <button mat-stroked-button color="primary" style="width: 100%;">Guardar</button>
                </div>
            </div>
            <div class="row" style="margin-bottom: 10px;" matSort>
                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="position">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by number">
                            No.
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                            Name
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="weight">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by weight">
                            Weight
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
                    </ng-container>

                    <ng-container matColumnDef="symbol">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by symbol">
                            Symbol
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</mat-dialog-content>
