<div class="main-body">
    <!--FILTERS-->
    <div class="row">
        <div class="col-md-12">
            <mat-form-field style="width: 145px;" appearance="outline">
                <mat-label>Fecha inicio</mat-label>
                <input matInput [matDatepicker]="fecha_inicio">
                <mat-datepicker-toggle matIconSuffix [for]="fecha_inicio">
                    <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                </mat-datepicker-toggle>
                <mat-datepicker #fecha_inicio></mat-datepicker>
            </mat-form-field>
            &nbsp;
            <mat-form-field style="width: 145px;" appearance="outline">
                <mat-label>Fecha fin</mat-label>
                <input matInput [matDatepicker]="fecha_fin">
                <mat-datepicker-toggle matIconSuffix [for]="fecha_fin">
                    <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                </mat-datepicker-toggle>
                <mat-datepicker #fecha_fin></mat-datepicker>
            </mat-form-field>
            &nbsp;
            <mat-form-field appearance="outline">
                <mat-label>Reporte</mat-label>
                <mat-select name="reporte">
                    <mat-option value="1">Option 1</mat-option>
                    <mat-option value="2">Option 2</mat-option>
                    <mat-option value="3">Option 3</mat-option>
                </mat-select>
            </mat-form-field>
            &nbsp;
            <button mat-fab color="accent" aria-label="Example icon button with a bookmark icon">
                <mat-icon>search</mat-icon>
            </button>
        </div>
    </div>

    <!--BUTTONS-->
    <div class="row">
        <div class="col-md-7">
            <button mat-flat-button (click)="openAddEditBlogForm()" color="accent">
                Agregar Blog
            </button>
            <button mat-flat-button (click)="openNuevoServicioDialog()" color="accent">
                Nuevo servicio
            </button>
            <button mat-flat-button (click)="openRegistroEventoDialog()" color="accent">
                Registrar motivo
            </button>
            <button mat-flat-button (click)="openMantClinicaDialog()" color="accent">
                Mant clinica
            </button>
        </div>
        <div class="col-md-5 text-right">
        </div>
    </div>

    <!--DATA TABLE-->
    <div>
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by id">
                    ID
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox class="example-margin"> {{row.id}}</mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="url">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by url">
                    URL
                </th>
                <td mat-cell *matCellDef="let row"> {{row.url}} </td>
            </ng-container>

            <ng-container matColumnDef="accion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Accion </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" (click)="openEditForm(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteBlog(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
            aria-label="Select page of periodic elements">
        </mat-paginator>
    </div>

    <!--BUTTONS FOOTER-->
    <div class="row" style="margin-top: 10px;">
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;" (click)="openVerDatosDialog()">
                Ver datos
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;" (click)="openSeguimientoDialog()">
                Segumiento
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;" (click)="openSoporteDialog()">
                Soporte
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-2">
            <button mat-flat-button color="accent" style="width: 100%;">
                Exportar
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
        <div class="col-md-3">
            <button mat-flat-button color="accent" style="width: 100%;" (click)="openTipoServicioDialog()">
                Nuevo servicio
            </button>
            <div style="padding: 3px 0;"></div>
        </div>
    </div>
</div>
