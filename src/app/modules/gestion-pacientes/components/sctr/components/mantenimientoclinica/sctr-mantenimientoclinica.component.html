<div mat-dialog-title>
    Registrar clínica
</div>
<mat-dialog-content>
    <form [formGroup]="formularioClinica">
        <input type="hidden" value="" formControlName="txtAccion">
        <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
            <mat-label>Código IPRESS</mat-label>
            <input matInput formControlName="txtCodIpress">
        </mat-form-field>
        <div class="row">
            <div class="col-md-10">
                <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                    <mat-label>Ubigeo</mat-label>
                    <input matInput formControlName="txtUbigeo">
                </mat-form-field>
            </div>
            <div class="col-md-2">
                <button mat-flat-button color="accent" style="width: 100%;" [disabled]="statusBtnBuscarUbigeo" (click)="openUbigeoDialog()">...</button>
            </div>
        </div>
        <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
            <mat-label>Dirección</mat-label>
            <input matInput formControlName="txtDireccion">
        </mat-form-field>
        <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="txtTelefono">
        </mat-form-field>
        <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
            <mat-label>Nombre clínica</mat-label>
            <input matInput formControlName="txtClinica">
        </mat-form-field>
        <div class="row" style="margin-bottom: 10px;">
            <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

                <ng-container matColumnDef="id_clinica">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por id_clinica">
                        IPRESS
                    </th>
                    <td mat-cell *matCellDef="let row"> {{row.id_clinica}} </td>
                </ng-container>

                <ng-container matColumnDef="clinica">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por clinica">
                        CLÍNICA
                    </th>
                    <td mat-cell *matCellDef="let row"> {{row.clinica}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row (click)="selectRow(row)" *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
                aria-label="Seleccione página">
            </mat-paginator>
        </div>
        <mat-form-field style="width: 100%;" appearance="outline">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="cboEstado" [value]="codEstado">
                <mat-option [value]="">--Seleccione opción--</mat-option>
                <mat-option [value]="1">ACTIVO</mat-option>
                <mat-option [value]="0">INACTIVO</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field style="width: 100%;" appearance="outline">
            <mat-label>Validación</mat-label>
            <mat-select formControlName="cboValidacion" [value]="codValidacion">
                <mat-option [value]="">--Seleccione opción--</mat-option>
                <mat-option [value]="1">CLÍNICA AFILIADA</mat-option>
                <mat-option [value]="0">CLÍNICA NO AFILIADA</mat-option>
            </mat-select>
        </mat-form-field>
        <div class="row">
            <div class="col-md-3">
                <button mat-flat-button color="accent" [disabled]="statusBtnNuevaClinica" (click)="newClinica()" style="width: 100%;">Nuevo</button>
            </div>
            <div class="col-md-3">
                <button mat-flat-button color="accent" (click)="cancelClinica()" style="width: 100%;">Cancelar</button>
            </div>
            <div class="col-md-3">
                <button mat-flat-button color="accent" [disabled]="statusBtnGuardarClinica" (click)="saveClinica()" style="width: 100%;">Guardar</button>
            </div>
            <div class="col-md-3">
                <button mat-flat-button color="accent" (click)="exitClinica()" style="width: 100%;">Salir</button>
            </div>
        </div>
    </form>
</mat-dialog-content>
