<form [formGroup]="formularioRegitraMotivoSctr">
    <div mat-dialog-title>
        Registro de motivo
    </div>
    <mat-dialog-content>
        <mat-radio-group aria-label="Select an option">
            <div class="row">
                <div class="col-md-6">
                    <mat-radio-button value="clinica" (change)="getPersonaReporta($event)">CLINICA / CENTRO
                        CLÍNICO</mat-radio-button>
                    <div class="row">
                        <div class="col-md-10">
                            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                                <mat-label>Nombre clínica / centro clínico</mat-label>
                                <input matInput formControlName="txtNombreClinica">
                            </mat-form-field>
                        </div>
                        <div class="col-md-2">
                            <button mat-flat-button color="accent" style="width: 100%;"
                                [disabled]="statusBtnBuscarClinica">...</button>
                        </div>
                    </div>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Dirección</mat-label>
                        <input matInput formControlName="txtDireccionClinica">
                    </mat-form-field>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Paciente que reporta</mat-label>
                        <input matInput formControlName="txtPacienteReportaClinica">
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-radio-button value="empresa" (change)="getPersonaReporta($event)">EMPRESA</mat-radio-button>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>RUC empresa</mat-label>
                        <input matInput formControlName="txtRucEmpresa">
                    </mat-form-field>
                    <div class="row">
                        <div class="col-md-9">
                            <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                                <mat-label>Nombre empresa</mat-label>
                                <input matInput formControlName="txtNombreEmpresa">
                            </mat-form-field>
                        </div>
                        <div class="col-md-3">
                            <button mat-flat-button color="accent" style="width: 100%;"
                                [disabled]="statusBtnRegistrarEmpresa">Registrar</button>
                        </div>
                    </div>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Paciente que reporta</mat-label>
                        <input matInput formControlName="txttxtPacienteReportaempresa">
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <mat-radio-button value="seguro" (change)="getPersonaReporta($event)">CORREDOR DE
                        SEGURO</mat-radio-button>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Paciente que reporta</mat-label>
                        <input matInput formControlName="txtPacienteReportaSeguro">
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-radio-button value="paciente" (change)="getPersonaReporta($event)">PACIENTE /
                        ASEGURADO</mat-radio-button>
                    <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
                        <mat-label>Paciente que reporta</mat-label>
                        <input matInput formControlName="txtPacienteReportaAsegurado">
                    </mat-form-field>
                </div>
            </div>
        </mat-radio-group>
        <mat-form-field class="example-full-width" style="width: 100%;" appearance="outline">
            <mat-label>Motivo de llamada</mat-label>
            <textarea matInput placeholder="Motivo de llamada" formControlName="txtMotivo"
                style="resize: none"></textarea>
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-flat-button color="accent">Guardar</button>
    </mat-dialog-actions>
</form>
