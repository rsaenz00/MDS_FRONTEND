<div mat-dialog-title>
    Pacientes
</div>
<mat-dialog-content>
    <mat-card class="example-card">
        <mat-card-content>
            <form class="row" [formGroup]="formularioClinicas" style="margin-bottom: 10px;">
                <div class="col-md-4">
                    <mat-form-field style="width: 100%;" appearance="outline" class="dense-2">
                        <mat-label>Apellido Paterno / DNI</mat-label>
                        <input matInput (keyup)="filtrarApePaternoDni($event)" placeholder="Apellidos Paterno / DNI"
                            formControlName="txtApePaternoDNI">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field style="width: 100%;" appearance="outline" class="dense-2">
                        <mat-label>Apellido Materno</mat-label>
                        <input matInput (keyup)="filtrarApeMaternoDni($event)" placeholder="Apellido Materno"
                            formControlName="txtApeMaterno">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field style="width: 100%;" appearance="outline" class="dense-2">
                        <mat-label>Nombres</mat-label>
                        <input matInput (keyup)="filtrarNombres($event)" placeholder="Nombres"
                            formControlName="txtNombres">
                    </mat-form-field>
                </div>
            </form>
            <div class="row m-t-20">
                <div class="col-12">
                    <div class="cardWithShadow">
                        <div class="table-container table scrollwrapper">
                            <table mat-table [dataSource]="dataSource" matSort
                                (matSortChange)="announceSortChange($event)">

                                <ng-container matColumnDef="tipo_documento">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header
                                        sortActionDescription="Ordenar por Tipo documento">
                                        TIPO DOC.
                                    </th>
                                    <td mat-cell *matCellDef="let row"> {{row.tipo_documento}} </td>
                                </ng-container>

                                <ng-container matColumnDef="numero_documento">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header
                                        sortActionDescription="Ordenar por Numero de documento">
                                        NUM. DOC.
                                    </th>
                                    <td mat-cell *matCellDef="let row"> {{row.numero_documento}} </td>
                                </ng-container>

                                <ng-container matColumnDef="nombres">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header
                                        sortActionDescription="Ordenar por nombres">
                                        Nombres
                                    </th>
                                    <td mat-cell *matCellDef="let row"> {{row.nombres}} </td>
                                </ng-container>

                                <ng-container matColumnDef="apellido_paterno">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header
                                        sortActionDescription="Ordenar por apellido paterno">
                                        Apellido Paterno
                                    </th>
                                    <td mat-cell *matCellDef="let row"> {{row.apellido_paterno}} </td>
                                </ng-container>

                                <ng-container matColumnDef="apellido_materno">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header
                                        sortActionDescription="Ordenar por apellido materno">
                                        Apellido Materno
                                    </th>
                                    <td mat-cell *matCellDef="let row"> {{row.apellido_materno}} </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row (click)="filaSeleccionada(row)"
                                    *matRowDef="let row; columns: displayedColumns;"></tr>
                            </table>
                            <ng-container *ngIf="countRows === 0">
                                <div class="row">
                                    <div class="col-sm-12 ml-4 mt-3">
                                        <label class="font-weight-bold"> {{'No existen datos'}}</label>
                                    </div>
                                </div>
                            </ng-container>

                            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
                                aria-label="Seleccione página">
                            </mat-paginator>
                        </div>
                    </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</mat-dialog-content>
