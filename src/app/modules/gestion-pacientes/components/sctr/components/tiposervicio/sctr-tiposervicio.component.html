<div mat-dialog-title>
    Tipo de servicio
</div>
<mat-dialog-content>
    <form [formGroup]="formTipoServicio">
        <div>
            <label id="example-radio-group-label">SKILL AVAYA</label>
        </div>
        <mat-radio-group aria-labelledby="example-radio-group-label" class="example-radio-group"
            formControlName="rbSkillAvaya">
            <mat-radio-button [value]="1" [checked]="true" (change)="getSkill($event)" class="example-radio-button">SKILL
                SCTR</mat-radio-button>
            <mat-radio-button [value]="2" (change)="getSkill($event)" class="example-radio-button">SKILL CONSULTAS
                COBERTURAS</mat-radio-button>
        </mat-radio-group>
        <mat-form-field style="width: 100%; margin-top: 10px;" appearance="outline" class="dense-2">
            <mat-label>Motivo</mat-label>
            <mat-select (selectionChange)="getMotivoCbo($event)" formControlName="cboMotivo" [value]="valMotivo">
                <mat-option [value]="">--Seleccione una opción--</mat-option>
                <mat-option [value]="motivo.id_motivo"
                    *ngFor="let motivo of motivos">{{motivo.descripcion}}</mat-option>
            </mat-select>
        </mat-form-field>
        <div class="row">
            <div class="col-md-6 text-center">
                <button mat-flat-button color="warn" (click)="exitTipoServicio()" style="width: 100%;">Salir</button>
            </div>
            <div class="col-md-6 text-center">
                <button mat-flat-button color="accent" (click)="nuevoServicioSctr()"
                    [disabled]="!formTipoServicio.valid" style="width: 100%;">Continuar</button>
            </div>
        </div>
    </form>
</mat-dialog-content>
